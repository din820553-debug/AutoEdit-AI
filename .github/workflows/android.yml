name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK and install API 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build and test (retain diagnostic log)
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Publish APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoEditAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoEditAI-build-log
          path: android-build.log
          if-no-files-found: warn
          retention-days: 14
