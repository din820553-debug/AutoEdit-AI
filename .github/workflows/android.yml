name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Test and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoEditAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
